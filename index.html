<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Allie & Caio</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="m-0 overflow-hidden bg-[#f7ead8] text-[#3e213a]">
    <main
      class="grid min-h-screen place-items-center overflow-hidden [perspective:1000px]"
    >
      <div class="envelope relative w-[700px] drop-shadow-2xl">
        <img src="new-assets/envelope_back.png" />

        <div
          class="letter-mask absolute inset-x-0 bottom-8 z-10 overflow-hidden px-12"
        >
          <div class="letter relative translate-y-3/4 mb-20">
            <img class="block w-full" src="new-assets/letter.png" />
            <h3 class="absolute inset-x-0 top-16 z-20 text-center">
              May 29th, 2027
            </h3>
          </div>
        </div>

        <img
          class="absolute inset-0 z-20"
          src="new-assets/envelope_front.png"
        />
        <img
          class="flap absolute inset-0 z-30 origin-top"
          src="new-assets/envelope_flap.png"
        />

        <img
          class="seal-art pointer-events-none absolute inset-0 z-40"
          src="new-assets/envelope_seal.png"
        />

        <button
          class="seal aspect-square absolute left-1/2 top-1/2 z-50 w-1/4 -translate-x-1/2 -translate-y-1/2 cursor-pointer rounded-full border-0 bg-transparent p-0"
          type="button"
          aria-label="Open invitation"
        ></button>
      </div>
    </main>

    <script type="module" src="script.js"></script>
  </body>
</html>
